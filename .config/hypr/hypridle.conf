general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = wlopm --on '*' 2>/dev/null || wlr-dpms on 2>/dev/null || hyprctl dispatch dpms on 2>/dev/null
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}


listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                                     # 5.5min
    on-timeout = wlopm --off '*' 2>/dev/null || wlr-dpms off 2>/dev/null || hyprctl dispatch dpms off 2>/dev/null
    on-resume = (wlopm --on '*' 2>/dev/null || wlr-dpms on 2>/dev/null || hyprctl dispatch dpms on 2>/dev/null) && brightnessctl -r
}

listener {
    timeout = 900                                # 15min
    on-timeout = systemctl suspend                # suspend pc
}
