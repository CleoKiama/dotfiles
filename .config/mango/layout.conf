# Layout, animation and scroller settings

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=400
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=5
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
smart_gaps=0

# Layout switching — switch_layout cycles through this list
circle_layout=scroller,tile

# Overview Setting
hotarea_size=10
enable_hotarea=0
# ov_tab_mode=0
overview_gap_inner=5
overview_gap_outer=30


# monitor rules
# laptop monitor (1920x1080 @ 1.0 default scale -> logical width = 1920px)
monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,vrr:0,rr:0

# Disable phantom Apple Studio Display half-panel on DP-1
# Only matches when manufacturer is Apple, so it will never touch the LG ultrawide
monitor_rule=name:^DP-1$,make:Apple Computer Inc,disable:1

# Apple Studio Display on DP-2 (2560x1440 @ 60Hz, 1:1 scale)
# Sharp 1440p resolution without 4K GPU rendering overhead
monitor_rule=name:^DP-2$,make:Apple Computer Inc,width:2560,height:1440,refresh:60,x:1920,y:0,scale:1.0

# HDMI Samsung monitor (1080p @ 60Hz, 1:1 native scale for crisp text)
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1.0

# HDMI LG Curved Ultrawide (3440x1440 @ 120Hz) - uncomment when using LG on HDMI
#monitor_rule=name:^HDMI-A-1$,width:3440,height:1440,refresh:120,x:1920,y:0,scale:1.0

# Thunderbolt/DP LG Curved Ultrawide (3440x1440 @ 121Hz)
monitor_rule=name:^DP-1$,width:3440,height:1440,refresh:121,x:1920,y:0,scale:1.0
