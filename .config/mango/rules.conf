# Appearance
# Window effects and layer rules

# Window effect
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 1
shadow_only_floating = 1
shadows_size = 25
shadows_blur = 40
shadows_position_x = 0
shadows_position_y = 0
shadows_color=0x000000ff

border_radius=10
border_px=1
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.94

# Horizontal inner gap: spacing between windows side-by-side
gap_inner_horizontal=6
# Vertical inner gap: spacing between windows stacked vertically
gap_inner_vertical=6
# Horizontal outer gap: spacing between windows and the left/right screen edges
gap_outer_horizontal=3
# Vertical outer gap: spacing between windows and the top/bottom screen edges
gap_outer_vertical=6

# Width of the scratchpad window (80% of screen width)
scratchpad_width_ratio=0.8
# Height of the scratchpad window (90% of screen height)
scratchpad_height_ratio=0.8
# Border color for windows currently in the scratchpad
scratchpad_color=0xfab387ff

# Color of the desktop background (visible through gaps)
root_color=0x11111bff
# Border color for windows that are not focused
border_color=0x313244ff
# Border color for the currently active/focused window
focus_color=0xcba6f7ff
# Border color when a window is in maximized screen mode
maximized_screen_color=0xf9e2afff
# Border color for windows requesting urgent attention
urgent_color=0xf38ba8ff
# Border color for "Global" windows pinned to all tags
global_color=0xff8c00ff
# Border color for "Overlay" windows that stay always on top
overlay_color=0x94e2d5ff


# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi
layer_rule=no_animation:1,no_blur:1,layer_name:selection


# window tag assignment rules
# Bypass xdg-activation token checks globally (allows all apps to steal focus on request):
# window_rule=activation_bypass:1,app_id:.*
window_rule=tags:1,activation_bypass:1,app_id:vivaldi-stable
window_rule=tags:2,app_id:com.mitchellh.ghostty
window_rule=tags:3,app_id:emacs
window_rule=tags:4,app_id:t3code

window_rule=tags:7,app_id:(?i)spotify
window_rule=tags:7,app_id:(?i)pano-scrobbler
window_rule=tags:8,activation_bypass:1,app_id:zen
window_rule=tags:9,app_id:slack
window_rule=tags:9,app_id:zapfast

# floating window rules
window_rule=is_floating:1,is_overlay:1,unfocused_opacity:1.0,no_blur:1,app_id:com.gabm.satty
window_rule=is_floating:1,is_overlay:1,width:950,height:600,app_id:org.pulseaudio.pavucontrol
window_rule=is_floating:1,is_overlay:1,width:700,height:400,app_id:(?i).*blueman.*
window_rule=is_floating:1,is_overlay:1,width:700,height:400,app_id:(?i).*connman.*
window_rule=is_floating:1,is_overlay:1,is_global:1,unfocused_opacity:1.0,no_blur:1,width:640,height:360,offset_x:100,offset_y:100,is_open_silent:1,title:(?i)picture[- ]in[- ]picture

# system update window rule
window_rule=is_floating:1,is_overlay:1,is_open_silent:1,width:1200,height:900,app_id:com.mitchellh.ghostty,title:system-update

# scratchpad rules
#btop 
window_rule=is_floating:1,is_named_scratchpad:1,width:1400,height:800,app_id:com.mitchellh.ghostty,title:btop
window_rule=is_named_scratchpad:1,width:1300,height:700,app_id:org.gnome.Nautilus
window_rule=is_floating:1,is_named_scratchpad:1,width:1400,height:900,app_id:com.mitchellh.ghostty,title:ObsidianNotes

# set all tags to the scroller layout
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# Enable auto-adjustment for single windows (0 = enable adjustment)
scroller_ignore_proportion_single=0

# Ensure the focused window is always centered
scroller_focus_center=1
