<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350">
  <style>
    :root { color-scheme: light dark; }
    rect.key { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5px; rx: 8px; ry: 8px; }
    rect.gap { fill: #f1f5f9; stroke: #cbd5e1; stroke-dasharray: 4 4; rx: 8px; ry: 8px; }
    rect.active { fill: #ecfdf5; stroke: #059669; stroke-width: 2px; rx: 8px; ry: 8px; }
    text { font-family: system-ui, -apple-system, sans-serif; text-anchor: middle; }
    text.title { font-size: 19px; font-weight: 800; fill: #0f172a; }
    text.subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
    text.phys { font-size: 9px; font-weight: 700; fill: #94a3b8; text-anchor: start; }
    text.main { font-size: 16px; font-weight: 800; fill: #059669; }
    text.sub { font-size: 11px; font-weight: 600; fill: #64748b; }
    text.dead { font-size: 11px; fill: #cbd5e1; }
    @media (prefers-color-scheme: dark) {
      rect.key { fill: #1e293b; stroke: #334155; }
      rect.gap { fill: #0f172a; stroke: #334155; }
      rect.active { fill: #064e3b; stroke: #34d399; }
      text.title { fill: #f8fafc; }
      text.subtitle { fill: #94a3b8; }
      text.phys { fill: #64748b; }
      text.main { fill: #34d399; }
      text.sub { fill: #94a3b8; }
      text.dead { fill: #475569; }
    }
